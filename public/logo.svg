<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Circular background -->
  <circle cx="256" cy="256" r="248" fill="#fff5f5"/>

  <!-- Red cross (behind everything) -->
  <rect x="196" y="72" width="120" height="368" rx="30" fill="#dc2626"/>
  <rect x="72" y="196" width="368" height="120" rx="30" fill="#dc2626"/>
  <!-- Cross 3D highlight -->
  <rect x="196" y="72" width="38" height="368" rx="30" fill="#ef4444" opacity="0.35"/>
  <rect x="72" y="196" width="368" height="38" rx="30" fill="#ef4444" opacity="0.35"/>
  <!-- Cross shadow edge -->
  <rect x="278" y="72" width="38" height="368" rx="30" fill="#b91c1c" opacity="0.25"/>
  <rect x="72" y="278" width="368" height="38" rx="30" fill="#b91c1c" opacity="0.25"/>

  <!-- ════════════════════════════════ -->
  <!--  TUBE OF OINTMENT — lower right -->
  <!-- ════════════════════════════════ -->
  <g transform="translate(362, 368) rotate(-32)">
    <!-- Crimp end (left) -->
    <rect x="-110" y="-18" width="28" height="36" rx="3" fill="#b8b8b8"/>
    <line x1="-108" y1="-12" x2="-85" y2="-12" stroke="#999" stroke-width="2.5"/>
    <line x1="-108" y1="-4" x2="-85" y2="-4" stroke="#999" stroke-width="2.5"/>
    <line x1="-108" y1="4" x2="-85" y2="4" stroke="#999" stroke-width="2.5"/>
    <line x1="-108" y1="12" x2="-85" y2="12" stroke="#999" stroke-width="2.5"/>
    <!-- Tube body -->
    <rect x="-85" y="-22" width="155" height="44" fill="#e8f0e8"/>
    <!-- Colored label -->
    <rect x="-70" y="-22" width="95" height="44" fill="#5b8c5a"/>
    <!-- Label text lines -->
    <rect x="-56" y="-10" width="66" height="5" rx="2.5" fill="white" opacity="0.7"/>
    <rect x="-56" y="0" width="50" height="4" rx="2" fill="white" opacity="0.45"/>
    <rect x="-56" y="9" width="38" height="3" rx="1.5" fill="white" opacity="0.35"/>
    <!-- Shoulder taper -->
    <path d="M70,-22 L82,-14 L82,14 L70,22 Z" fill="#d0dcd0"/>
    <!-- Cap body -->
    <rect x="70" y="-22" width="36" height="44" rx="5" fill="#3a6b39"/>
    <!-- Cap tip -->
    <rect x="98" y="-14" width="18" height="28" rx="9" fill="#2d5429"/>
    <!-- Tube body highlight -->
    <rect x="-85" y="-20" width="160" height="10" rx="4" fill="white" opacity="0.2"/>
  </g>

  <!-- ═══════════════════════════════════ -->
  <!--  BAND-AIDS — upper right, overlaid  -->
  <!-- ═══════════════════════════════════ -->
  <!-- Band-aid 1 (back, rotated -20°) -->
  <g transform="translate(360, 158) rotate(-20)">
    <rect x="-75" y="-21" width="150" height="42" rx="8" fill="#e8b878"/>
    <!-- Left tab -->
    <rect x="-75" y="-21" width="38" height="42" rx="8" fill="#e0a860"/>
    <!-- Right tab -->
    <rect x="37" y="-21" width="38" height="42" rx="8" fill="#e0a860"/>
    <!-- Center pad -->
    <rect x="-22" y="-15" width="44" height="30" rx="4" fill="white" opacity="0.88"/>
    <!-- Pad cross-hatch dots -->
    <circle cx="-8" cy="-4" r="2.8" fill="#c89048" opacity="0.6"/>
    <circle cx="8" cy="-4" r="2.8" fill="#c89048" opacity="0.6"/>
    <circle cx="-8" cy="4" r="2.8" fill="#c89048" opacity="0.6"/>
    <circle cx="8" cy="4" r="2.8" fill="#c89048" opacity="0.6"/>
    <!-- Left vent slits -->
    <line x1="-64" y1="-12" x2="-64" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <line x1="-55" y1="-12" x2="-55" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <!-- Right vent slits -->
    <line x1="55" y1="-12" x2="55" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <line x1="64" y1="-12" x2="64" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <!-- Outline -->
    <rect x="-75" y="-21" width="150" height="42" rx="8" fill="none" stroke="#c89048" stroke-width="1.5"/>
  </g>

  <!-- Band-aid 2 (front, rotated +12°, so ~32° spread) -->
  <g transform="translate(355, 178) rotate(12)">
    <rect x="-75" y="-21" width="150" height="42" rx="8" fill="#edc080"/>
    <rect x="-75" y="-21" width="38" height="42" rx="8" fill="#e2ae68"/>
    <rect x="37" y="-21" width="38" height="42" rx="8" fill="#e2ae68"/>
    <rect x="-22" y="-15" width="44" height="30" rx="4" fill="white" opacity="0.9"/>
    <circle cx="-8" cy="-4" r="2.8" fill="#c89048" opacity="0.6"/>
    <circle cx="8" cy="-4" r="2.8" fill="#c89048" opacity="0.6"/>
    <circle cx="-8" cy="4" r="2.8" fill="#c89048" opacity="0.6"/>
    <circle cx="8" cy="4" r="2.8" fill="#c89048" opacity="0.6"/>
    <line x1="-64" y1="-12" x2="-64" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <line x1="-55" y1="-12" x2="-55" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <line x1="55" y1="-12" x2="55" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <line x1="64" y1="-12" x2="64" y2="12" stroke="#c89048" stroke-width="2.2"/>
    <rect x="-75" y="-21" width="150" height="42" rx="8" fill="none" stroke="#c89048" stroke-width="1.5"/>
  </g>

  <!-- ══════════════════════════════════════ -->
  <!--  PILLS PILE — left side of cross       -->
  <!-- ══════════════════════════════════════ -->
  <!-- Pile shadow -->
  <ellipse cx="208" cy="330" rx="80" ry="14" fill="black" opacity="0.1"/>

  <!-- Pill back (in pile, lowest z) -->
  <g transform="translate(202, 298) rotate(-6)">
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="#ede8de" stroke="#c8c0b0" stroke-width="2"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#bdb5a5" stroke-width="2"/>
    <ellipse cx="-15" cy="-8" rx="18" ry="7" fill="white" opacity="0.45"/>
  </g>

  <!-- Pill middle -->
  <g transform="translate(210, 268) rotate(7)">
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="#f0ece2" stroke="#c8c0b0" stroke-width="2"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#bdb5a5" stroke-width="2"/>
    <ellipse cx="-15" cy="-8" rx="18" ry="7" fill="white" opacity="0.45"/>
  </g>

  <!-- Pill front (top of pile) -->
  <g transform="translate(198, 238) rotate(-3)">
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="#f5f2ea" stroke="#c8c0b0" stroke-width="2"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#bdb5a5" stroke-width="2"/>
    <ellipse cx="-15" cy="-8" rx="18" ry="7" fill="white" opacity="0.5"/>
  </g>

  <!-- Rolling pill (escaped from pile, lower right of pile) -->
  <g transform="translate(316, 308) rotate(22)">
    <ellipse cx="0" cy="0" rx="58" ry="24" fill="#f5f2ea" stroke="#c8c0b0" stroke-width="2"/>
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#bdb5a5" stroke-width="2"/>
    <ellipse cx="-15" cy="-8" rx="18" ry="7" fill="white" opacity="0.45"/>
    <!-- Small shadow under rolling pill -->
    <ellipse cx="0" cy="30" rx="44" ry="8" fill="black" opacity="0.07"/>
  </g>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="256" r="246" fill="none" stroke="#fca5a5" stroke-width="4" opacity="0.55"/>
</svg>
